# WeChat API authenticated relay.
# Purpose: let hosts whose IPs are NOT in the WeChat IP whitelist (e.g. Claude
# Code cloud sessions) call api.weixin.qq.com through this server, whose fixed
# IP IS whitelisted. Requests must carry the header:  X-Relay-Token: <token>
#
# Install: /etc/nginx/conf.d/wechat-relay.conf   (included inside http{})
# Replace the two placeholders below before reloading nginx:
#   RELAY_DOMAIN      your domain pointing at this server (A record)
#   RELAY_TOKEN_VALUE output of `openssl rand -hex 32`
# TLS: run `certbot --nginx -d RELAY_DOMAIN` after installing this file
# (certbot rewrites the listen/ssl lines in place).

map $http_x_relay_token $wechat_relay_ok {
    default              0;
    "RELAY_TOKEN_VALUE"  1;
}

server {
    listen 80;
    listen [::]:80;
    server_name RELAY_DOMAIN;

    # Everything except the WeChat API path space is a 404.
    location / {
        return 404;
    }

    location /cgi-bin/ {
        if ($wechat_relay_ok = 0) {
            return 403;
        }
        limit_except GET POST {
            deny all;
        }

        # Re-resolve WeChat's IPs instead of pinning them at nginx startup.
        resolver 223.5.5.5 119.29.29.29 valid=300s;
        set $wechat_upstream "https://api.weixin.qq.com";
        proxy_pass $wechat_upstream;

        proxy_set_header Host api.weixin.qq.com;
        proxy_set_header X-Relay-Token "";
        proxy_ssl_server_name on;
        proxy_ssl_name api.weixin.qq.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Cover uploads (permanent material limit is 10 MB).
        client_max_body_size 12m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

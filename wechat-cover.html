<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公众号封面生成器</title>
<style>
  :root {
    --border: #e5e5e5;
    --muted: #888;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #fafafa;
    color: #222;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .tip { color: var(--muted); font-size: 13px; line-height: 1.7; margin-bottom: 20px; }
  .main { display: flex; gap: 28px; flex-wrap: wrap; }
  .controls { flex: 0 0 320px; display: flex; flex-direction: column; gap: 16px; }
  .previews { flex: 1; min-width: 320px; }
  label { font-size: 13px; color: #555; display: block; margin-bottom: 6px; }
  textarea, input[type=text] {
    width: 100%;
    font: inherit;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
  }
  textarea { height: 92px; resize: vertical; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch {
    width: 44px; height: 30px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch.active { border-color: #222; box-shadow: 0 0 0 2px #fff inset; }
  button {
    font: inherit;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
  }
  button:hover { background: #f0f0f0; }
  button.primary { background: #222; color: #fff; border-color: #222; }
  button.primary:hover { background: #000; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input[type=range] { flex: 1; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; }
  .canvas-box { margin-bottom: 18px; }
  .canvas-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  #square { max-width: 260px; }
  .dl { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>公众号封面生成器</h1>
  <p class="tip">
    输入标题，自动生成两张封面：<b>首图 2.35:1</b>（1800×766）和<b>次图 1:1</b>（766×766）。
    文字始终排在中央 1:1 安全区内，1:1 版就是 2.35:1 版的中央裁剪 ——
    上传 2.35:1 大图后，在公众号后台裁小图时直接取中即可，不会切到字。
    标题中的换行会保留；虚线仅为安全区提示，不会导出。
  </p>

  <div class="main">
    <div class="controls">
      <div>
        <label>文章标题（回车可手动换行）</label>
        <textarea id="title" placeholder="在这里输入文章标题"></textarea>
      </div>
      <div>
        <label>底部小字（可选，如公众号名）</label>
        <input type="text" id="subtitle" placeholder="愚千一">
      </div>
      <div>
        <label>背景配色</label>
        <div class="swatches" id="swatches"></div>
        <div class="row" style="margin-top:8px">
          <button id="shuffle">随机换一组</button>
        </div>
      </div>
      <div>
        <label>字号微调</label>
        <div class="row">
          <input type="range" id="scale" min="60" max="120" value="100">
          <span id="scaleVal" style="font-size:13px;color:#555;width:42px">100%</span>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="guides" checked> 预览时显示 1:1 安全区虚线</label>
      <div class="dl">
        <button class="primary" id="dlBoth">下载两张封面</button>
        <button id="dlWide">仅 2.35:1</button>
        <button id="dlSquare">仅 1:1</button>
      </div>
    </div>

    <div class="previews">
      <div class="canvas-box">
        <div class="canvas-label">首图 2.35:1（900×383 的 2 倍图）</div>
        <canvas id="wide"></canvas>
      </div>
      <div class="canvas-box">
        <div class="canvas-label">次图 1:1（中央裁剪）</div>
        <canvas id="square"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // 2.35:1 @2x（900×383 的两倍）；1:1 取中央 H×H
  var W = 1800, H = 766;
  var SQ_X = (W - H) / 2; // 中央安全区左边界

  var FONT_STACK = '-apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';

  // [背景色1, 背景色2, 文字颜色]
  var PALETTES = [
    ['#1e3a5f', '#0f2027', '#ffffff'],
    ['#134e4a', '#022c22', '#ffffff'],
    ['#7f1d1d', '#450a0a', '#ffffff'],
    ['#4c1d95', '#1e1b4b', '#ffffff'],
    ['#1e40af', '#172554', '#ffffff'],
    ['#c2540a', '#7c2d12', '#ffffff'],
    ['#334155', '#0f172a', '#ffffff'],
    ['#6d4c2f', '#3e2a17', '#ffffff'],
    ['#faf5eb', '#eadfc8', '#3f2f1e'],
    ['#e3f2f0', '#bfe0da', '#10403b'],
    ['#fdf0cf', '#f5dd90', '#713f12'],
    ['#eceff4', '#cfd8e3', '#22324a']
  ];

  var master = document.createElement('canvas');
  master.width = W; master.height = H;
  var mctx = master.getContext('2d');

  var wideCanvas = document.getElementById('wide');
  var squareCanvas = document.getElementById('square');
  wideCanvas.width = W; wideCanvas.height = H;
  squareCanvas.width = H; squareCanvas.height = H;

  var titleEl = document.getElementById('title');
  var subtitleEl = document.getElementById('subtitle');
  var scaleEl = document.getElementById('scale');
  var scaleValEl = document.getElementById('scaleVal');
  var guidesEl = document.getElementById('guides');

  var paletteIndex = 0;

  function hashCode(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  // 简单可复现随机数（装饰圆的位置随配色固定，不随刷新乱跳）
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 逐字换行：CJK 按字断，连续的字母/数字当作一个词不拆开
  function wrapLine(ctx, text, maxWidth) {
    var tokens = text.match(/[A-Za-z0-9@#&%._\-]+|\s+|./g) || [];
    var lines = [], line = '';
    for (var i = 0; i < tokens.length; i++) {
      var t = tokens[i];
      var test = line + t;
      if (line && ctx.measureText(test).width > maxWidth) {
        lines.push(line.replace(/\s+$/, ''));
        line = /^\s+$/.test(t) ? '' : t;
      } else {
        line = test;
      }
    }
    if (line.replace(/\s+$/, '')) lines.push(line.replace(/\s+$/, ''));
    return lines;
  }

  function layoutTitle(ctx, text, maxWidth, maxHeight, userScale) {
    var paragraphs = text.split('\n');
    for (var size = Math.round(170 * userScale); size >= 30; size -= 2) {
      ctx.font = 'bold ' + size + 'px ' + FONT_STACK;
      var lines = [];
      for (var p = 0; p < paragraphs.length; p++) {
        lines = lines.concat(wrapLine(ctx, paragraphs[p], maxWidth));
      }
      var lineHeight = Math.round(size * 1.4);
      if (lines.length * lineHeight <= maxHeight) {
        return { size: size, lines: lines, lineHeight: lineHeight };
      }
    }
    return { size: 30, lines: paragraphs, lineHeight: 42 };
  }

  function render() {
    var title = titleEl.value.trim() || '文章标题';
    var subtitle = subtitleEl.value.trim();
    var pal = PALETTES[paletteIndex];
    var userScale = scaleEl.value / 100;

    // 背景渐变
    var g = mctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, pal[0]);
    g.addColorStop(1, pal[1]);
    mctx.fillStyle = g;
    mctx.fillRect(0, 0, W, H);

    // 装饰圆：放在安全区两侧的宽幅区域，避免 2.35:1 两边太空
    var rand = mulberry32(hashCode(title) + paletteIndex * 7919);
    mctx.save();
    mctx.fillStyle = pal[2];
    for (var i = 0; i < 4; i++) {
      var onLeft = i % 2 === 0;
      var cx = onLeft ? rand() * SQ_X : W - rand() * SQ_X;
      var cy = rand() * H;
      var r = 120 + rand() * 260;
      mctx.globalAlpha = 0.04 + rand() * 0.05;
      mctx.beginPath();
      mctx.arc(cx, cy, r, 0, Math.PI * 2);
      mctx.fill();
    }
    mctx.restore();

    // 标题：限制在中央 1:1 安全区内
    var pad = 80;
    var maxWidth = H - pad * 2;
    var maxHeight = H * (subtitle ? 0.58 : 0.66);
    var layout = layoutTitle(mctx, title, maxWidth, maxHeight, userScale);

    mctx.fillStyle = pal[2];
    mctx.textAlign = 'center';
    mctx.textBaseline = 'middle';
    mctx.font = 'bold ' + layout.size + 'px ' + FONT_STACK;

    var blockHeight = layout.lines.length * layout.lineHeight;
    var startY = H / 2 - blockHeight / 2 + layout.lineHeight / 2 - (subtitle ? 16 : 0);
    for (var j = 0; j < layout.lines.length; j++) {
      mctx.fillText(layout.lines[j], W / 2, startY + j * layout.lineHeight);
    }

    // 标题上方的短装饰线
    mctx.save();
    mctx.globalAlpha = 0.55;
    mctx.fillRect(W / 2 - 40, startY - layout.lineHeight / 2 - 44, 80, 6);
    mctx.restore();

    // 底部小字（同样在安全区内）
    if (subtitle) {
      mctx.save();
      mctx.globalAlpha = 0.75;
      mctx.font = '34px ' + FONT_STACK;
      mctx.fillText(subtitle, W / 2, H - 72);
      mctx.restore();
    }

    // 预览：2.35:1
    var wctx = wideCanvas.getContext('2d');
    wctx.clearRect(0, 0, W, H);
    wctx.drawImage(master, 0, 0);
    if (guidesEl.checked) {
      wctx.save();
      wctx.strokeStyle = pal[2];
      wctx.globalAlpha = 0.55;
      wctx.setLineDash([14, 10]);
      wctx.lineWidth = 3;
      wctx.strokeRect(SQ_X, 1.5, H, H - 3);
      wctx.restore();
    }

    // 预览：1:1 中央裁剪
    var sctx = squareCanvas.getContext('2d');
    sctx.clearRect(0, 0, H, H);
    sctx.drawImage(master, SQ_X, 0, H, H, 0, 0, H, H);
  }

  function slug(s) {
    return (s || 'cover').replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 24);
  }

  function download(canvas, suffix) {
    var name = slug(titleEl.value.trim()) + suffix + '.png';
    canvas.toBlob(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    }, 'image/png');
  }

  function exportWide() {
    download(master, '-2.35x1');
  }
  function exportSquare() {
    var c = document.createElement('canvas');
    c.width = H; c.height = H;
    c.getContext('2d').drawImage(master, SQ_X, 0, H, H, 0, 0, H, H);
    download(c, '-1x1');
  }

  // 色卡
  var swatchesEl = document.getElementById('swatches');
  PALETTES.forEach(function (pal, i) {
    var d = document.createElement('div');
    d.className = 'swatch';
    d.style.background = 'linear-gradient(135deg,' + pal[0] + ',' + pal[1] + ')';
    d.title = '配色 ' + (i + 1);
    d.addEventListener('click', function () {
      setPalette(i);
    });
    swatchesEl.appendChild(d);
  });

  function setPalette(i) {
    paletteIndex = i;
    var nodes = swatchesEl.children;
    for (var k = 0; k < nodes.length; k++) nodes[k].classList.toggle('active', k === i);
    render();
  }

  document.getElementById('shuffle').addEventListener('click', function () {
    var next;
    do { next = Math.floor(Math.random() * PALETTES.length); } while (next === paletteIndex);
    setPalette(next);
  });
  document.getElementById('dlBoth').addEventListener('click', function () {
    exportWide();
    setTimeout(exportSquare, 300); // 稍微错开，避免浏览器拦截连续下载
  });
  document.getElementById('dlWide').addEventListener('click', exportWide);
  document.getElementById('dlSquare').addEventListener('click', exportSquare);

  titleEl.addEventListener('input', render);
  subtitleEl.addEventListener('input', render);
  guidesEl.addEventListener('change', render);
  scaleEl.addEventListener('input', function () {
    scaleValEl.textContent = scaleEl.value + '%';
    render();
  });

  setPalette(hashCode(titleEl.value || String(Date.now())) % PALETTES.length);
})();
</script>
</body>
</html>
